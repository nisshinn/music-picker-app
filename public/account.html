<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotifyアカウント - Music Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         ハンバーガーメニュー
    ========================================== -->

    <button id="menuButton" class="menu-button">
        ☰
    </button>

    <div id="sideMenu" class="side-menu">

        <button id="closeMenu" class="close-menu">
            ×
        </button>

        <h2>メニュー</h2>

        <button onclick="location.href='history.html'">
            🕘 履歴
        </button>

        <button onclick="location.href='account.html'">
            🎵 Spotifyアカウント
        </button>

        <button onclick="location.href='settings.html'">
            ⚙️ 設定
        </button>

    </div>

    <div id="menuOverlay" class="menu-overlay"></div>


    <!-- ==========================================
         アカウントページ
    ========================================== -->

    <main class="sub-page account-page">

        <div class="page-header">

            <button
                class="back-button"
                onclick="location.href='index.html'">

                ←

            </button>

            <h1>🎵 Spotifyアカウント</h1>

        </div>


        <p class="subtitle">
            Spotifyとの接続状態
        </p>


        <!-- ======================================
             接続状態
        ====================================== -->

        <section class="account-card">

            <div class="account-icon">
                🎵
            </div>

            <h2 id="spotifyStatus">
                確認中...
            </h2>

            <p id="spotifyStatusText">
                Spotifyの接続状態を確認しています。
            </p>

        </section>


        <!-- ======================================
             ログインボタン
        ====================================== -->

        <button
            id="spotifyLoginButton"
            class="spotify-login-button"
            onclick="location.href='/auth/login'">

            🎵 Spotifyにログイン

        </button>


        <!-- ======================================
             説明
        ====================================== -->

        <section class="account-info">

            <h2>できること</h2>

            <p>
                Spotifyと接続すると、Music Pickerから
                Spotifyの曲を検索したり、TOP曲を確認したりできます。
            </p>

            <p>
                ※アクセストークンなどの重要な情報は
                この画面には表示しません。
            </p>

        </section>

    </main>


    <!-- ==========================================
         下のナビゲーション
    ========================================== -->

    <nav class="bottom-nav">

        <button
            onclick="location.href='index.html'"
            class="nav-item">

            <span>🏠</span>
            <small>ホーム</small>

        </button>


        <button
            onclick="location.href='search.html'"
            class="nav-item">

            <span>🔍</span>
            <small>検索</small>

        </button>


        <button
            onclick="location.href='favorites.html'"
            class="nav-item">

            <span>❤️</span>
            <small>お気に入り</small>

        </button>


        <button
            onclick="location.href='top-tracks.html'"
            class="nav-item">

            <span>🔥</span>
            <small>TOP曲</small>

        </button>

    </nav>


    <!-- ==========================================
         JavaScript
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
