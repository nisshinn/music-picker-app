<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music Picker</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>


<!-- =========================================================
     ハンバーガーボタン
     ========================================================= -->

<button
    id="menuButton"
    class="menu-button"
    aria-label="メニュー"
>
    ☰
</button>


<!-- =========================================================
     メニュー
     ========================================================= -->

<div
    id="menuOverlay"
    class="menu-overlay"
></div>


<nav
    id="sideMenu"
    class="side-menu"
>

    <div class="menu-title">
        🎵 Music Picker
    </div>


    <button
        class="menu-link active"
        data-page="homePage"
    >
        🏠 ホーム
    </button>


    <button
        class="menu-link"
        data-page="searchPage"
    >
        🔎 曲を検索
    </button>


    <button
        class="menu-link"
        data-page="favoritesPage"
    >
        ❤️ お気に入り
    </button>


    <button
        class="menu-link"
        data-page="historyPage"
    >
        📜 履歴
    </button>


    <button
        class="menu-link"
        data-page="settingsPage"
    >
        ⚙️ 設定
    </button>

</nav>


<!-- =========================================================
     メイン
     ========================================================= -->

<main id="app">


    <!-- =====================================================
         ホーム
         ===================================================== -->

    <section
        id="homePage"
        class="page active-page"
    >

        <header class="main-header">

            <h1>
                🎵 Music Picker
            </h1>

            <p>
                今の気分にぴったりの曲を探そう！
            </p>

        </header>


        <!-- Spotify -->

        <section class="spotify-box">

            <a
                href="/auth/login"
                id="spotifyLoginButton"
                class="spotify-login-button"
            >
                🎵 Spotifyにログイン
            </a>

            <div
                id="spotifyStatus"
                class="spotify-status"
            >
                Spotify未接続
            </div>

        </section>


        <!-- アーティスト -->

        <section class="picker-box">

            <h2>
                🎤 アーティスト
            </h2>

            <p>
                好きなアーティストを選べます
            </p>


            <input
                type="text"
                id="artistSearch"
                class="artist-search"
                placeholder="アーティスト名を入力..."
                autocomplete="off"
            >


            <div
                id="artistResults"
                class="artist-results"
            ></div>


            <div
                id="selectedArtist"
                class="selected-artist"
                style="display:none;"
            ></div>

        </section>


        <!-- ジャンル -->

        <section class="picker-box">

            <h2>
                🎸 ジャンル
            </h2>


            <select
                id="genre"
                class="genre-select"
            >

                <option value="all">
                    ジャンルを選択
                </option>

                <option value="j-pop">
                    J-Pop
                </option>

                <option value="rock">
                    Rock
                </option>

                <option value="pop">
                    Pop
                </option>

                <option value="hip-hop">
                    Hip-Hop
                </option>

                <option value="electronic">
                    Electronic
                </option>

                <option value="anime">
                    Anime
                </option>

            </select>

        </section>


        <!-- 気分 -->

        <section class="picker-box">

            <h2>
                😊 今の気分
            </h2>


            <div class="moods">

                <button
                    type="button"
                    data-mood="楽しい"
                >
                    😆 楽しい
                </button>


                <button
                    type="button"
                    data-mood="テンション高い"
                >
                    🔥 テンション高い
                </button>


                <button
                    type="button"
                    data-mood="落ち着きたい"
                >
                    😌 落ち着きたい
                </button>


                <button
                    type="button"
                    data-mood="しんみり"
                >
                    😢 しんみり
                </button>

            </div>

        </section>


        <!-- 作成 -->

        <button
            id="makePlaylist"
            class="make-playlist-button"
        >
            🎵 5曲選ぶ
        </button>


        <!-- プレイリスト -->

        <section
            id="playlist"
            class="playlist"
        ></section>

    </section>



    <!-- =====================================================
         検索
         ===================================================== -->

    <section
        id="searchPage"
        class="page"
    >

        <div class="page-header">

            <h1>
                🔎 曲を検索
            </h1>

            <p>
                Spotifyから曲を探します
            </p>

        </div>


        <section class="content-box">

            <input
                type="text"
                id="songSearchInput"
                class="big-search"
                placeholder="曲名・アーティスト名を入力..."
                autocomplete="off"
            >


            <button
                id="songSearchButton"
                class="search-button"
            >
                🔎 検索
            </button>


            <div
                id="searchResults"
                class="search-results"
            ></div>

        </section>

    </section>



    <!-- =====================================================
         お気に入り
         ===================================================== -->

    <section
        id="favoritesPage"
        class="page"
    >

        <div class="page-header">

            <h1>
                ❤️ お気に入り
            </h1>

            <p>
                お気に入りに追加した曲
            </p>

        </div>


        <section class="content-box">

            <div
                id="favoritesList"
                class="track-list"
            ></div>

        </section>

    </section>



    <!-- =====================================================
         履歴
         ===================================================== -->

    <section
        id="historyPage"
        class="page"
    >

        <div class="page-header">

            <h1>
                📜 履歴
            </h1>

            <p>
                最近作ったプレイリスト
            </p>

        </div>


        <section class="content-box">

            <div
                id="historyList"
                class="track-list"
            ></div>

        </section>

    </section>



    <!-- =====================================================
         設定
         ===================================================== -->

    <section
        id="settingsPage"
        class="page"
    >

        <div class="page-header">

            <h1>
                ⚙️ 設定
            </h1>

        </div>


        <section class="content-box settings-box">

            <button
                id="clearFavorites"
                class="danger-button"
            >
                ❤️ お気に入りを全部削除
            </button>


            <button
                id="clearHistory"
                class="danger-button"
            >
                📜 履歴を全部削除
            </button>

        </section>

    </section>

</main>
<!-- =========================================================
     下部ナビゲーション
     ========================================================= -->

<nav class="bottom-nav" id="bottomNav">

    <button
        class="bottom-nav-link active"
        data-page="homePage"
    >
        <span class="bottom-nav-icon">⌂</span>
        <span>ホーム</span>
    </button>


    <button
        class="bottom-nav-link"
        data-page="searchPage"
    >
        <span class="bottom-nav-icon search-icon"></span>
        <span>検索</span>
    </button>


    <button
        class="bottom-nav-link"
        data-page="favoritesPage"
    >
        <span class="bottom-nav-icon">♡</span>
        <span>お気に入り</span>
    </button>


    <button
        class="bottom-nav-link"
        data-page="historyPage"
    >
        <span class="bottom-nav-icon">▤</span>
        <span>履歴</span>
    </button>

</nav>


<!-- =========================================================
     Spotifyプレイヤー
     ========================================================= -->

<div
    id="playerPanel"
    class="player-panel"
    style="display:none;"
>

    <div class="player-main">


        <img
            id="playerImage"
            class="player-image"
            src=""
            alt=""
        >


        <div class="player-info">

            <div
                id="playerTitle"
                class="player-title"
            >
                曲名
            </div>


            <div
                id="playerArtist"
                class="player-artist"
            >
                アーティスト
            </div>

        </div>


        <div class="player-controls">

            <button
                id="previousButton"
                class="player-button"
            >
                ⏮
            </button>


            <button
                id="playPauseButton"
                class="player-button play-button"
            >
                ▶
            </button>


            <button
                id="nextButton"
                class="player-button"
            >
                ⏭
            </button>

        </div>


        <div class="volume-container">

            <span>
                🔊
            </span>

            <input
                type="range"
                id="volumeBar"
                min="0"
                max="100"
                value="50"
            >

            <span id="volumeValue">
                50%
            </span>

        </div>

    </div>


    <div class="progress-container">

        <span id="currentTime">
            0:00
        </span>


        <input
            type="range"
            id="progressBar"
            min="0"
            max="100"
            value="0"
        >


        <span id="duration">
            0:00
        </span>

    </div>

</div>



<!-- =========================================================
     JavaScript
     ========================================================= -->

<script src="/script.js"></script>

<script src="https://sdk.scdn.co/spotify-player.js"></script>


</body>

</html>
