<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         ☰ ハンバーガーメニュー
    ========================================== -->

    <button id="menuButton" class="menu-button">
        ☰
    </button>

    <div id="sideMenu" class="side-menu">

        <div class="menu-header">

            <h2>メニュー</h2>

            <button id="closeMenu" class="close-menu">
                ×
            </button>

        </div>

        <div class="menu-items">

            <button
                class="menu-item"
                onclick="location.href='history.html'">
                🕘 履歴
            </button>

            <button
                class="menu-item"
                onclick="location.href='account.html'">
                🎵 Spotifyアカウント
            </button>

            <button
                class="menu-item"
                onclick="location.href='settings.html'">
                ⚙️ 設定
            </button>

        </div>

    </div>

    <div id="menuOverlay" class="menu-overlay"></div>


    <!-- ==========================================
         🏠 ホーム
    ========================================== -->

    <main class="app">

        <h1>🎵 Music Picker</h1>

        <p class="subtitle">
            今の気分にぴったりの曲を探そう！
        </p>


        <!-- ======================================
             Spotifyログイン
        ====================================== -->

        <div class="box">

            <button
                id="spotifyLoginButton"
                class="spotify-login"
                onclick="location.href='/auth/login'">

                🎵 Spotifyにログイン

            </button>

            <p id="spotifyStatus">
                Spotify未接続
            </p>

        </div>


        <!-- ======================================
             アーティスト
        ====================================== -->

        <div class="box">

            <h2>🎤 アーティスト</h2>

            <p class="section-description">
                好きなアーティストを選べます
            </p>

            <div class="artist-search">

                <input
                    type="text"
                    id="artistSearch"
                    placeholder="アーティスト名を入力..."
                    autocomplete="off">

                <div id="artistResults"></div>

            </div>

            <div
                id="selectedArtist"
                class="selected-artist"
                style="display: none;">
            </div>

        </div>


        <!-- ======================================
             ジャンル
        ====================================== -->

        <div class="box">

            <h2>🎼 ジャンル</h2>

            <select id="genre">

                <option value="all">すべて</option>

                <option value="J-POP">J-POP</option>

                <option value="ロック">ロック</option>

                <option value="ポップ">ポップ</option>

                <option value="アニメ">アニメ</option>

                <option value="ボカロ">ボカロ</option>

                <option value="ヒップホップ">ヒップホップ</option>

                <option value="EDM">EDM</option>

                <option value="クラシック">クラシック</option>

                <option value="ジャズ">ジャズ</option>

                <option value="バラード">バラード</option>

            </select>

        </div>


        <!-- ======================================
             気分
        ====================================== -->

        <div class="box">

            <h2>😊 今の気分</h2>

            <div class="moods">

                <button
                    class="mood-button"
                    data-mood="楽しい">
                    😆 楽しい
                </button>

                <button
                    class="mood-button"
                    data-mood="テンション高い">
                    🔥 テンション高い
                </button>

                <button
                    class="mood-button"
                    data-mood="落ち着きたい">
                    😌 落ち着きたい
                </button>

                <button
                    class="mood-button"
                    data-mood="しんみり">
                    🌙 しんみり
                </button>

            </div>

            <button
                id="makePlaylist"
                class="make-button">

                🎵 5曲選ぶ

            </button>

        </div>


        <!-- ======================================
             🎵 プレイリスト
        ====================================== -->

        <section id="playlist">

        </section>


        <!-- ======================================
             🎵 再生プレイヤー
        ====================================== -->

<section id="playerPanel" class="player-panel">
<div class="volume-container">
    <span>🔊</span>

    <input
        type="range"
        id="volumeBar"
        min="0"
        max="100"
        value="50"
    >

    <span id="volumeValue">50%</span>
</div>

    <div id="playerSongTitle">
        再生していません
    </div>

    <div id="playerArtist"></div>

    <div class="player-controls">

        <button
            id="previousButton"
            type="button">
            ⏮
        </button>

        <button
            id="playPauseButton"
            type="button">
            ▶
        </button>

        <button
            id="nextButton"
            type="button">
            ⏭
        </button>

    </div>


    <div class="progress-container">

        <span id="currentTime">
            0:00
        </span>

        <input
            type="range"
            id="progressBar"
            min="0"
            max="100"
            value="0"
        >

        <span id="duration">
            0:00
        </span>

    </div>


    <!-- 音量 -->

    <div class="volume-container">

        <span class="volume-icon">
            🔊
        </span>

        <input
            type="range"
            id="volumeBar"
            min="0"
            max="100"
            value="50"
        >

        <span id="volumeValue">
            50%
        </span>

    </div>

</section>

                <div id="playerStatus">
                    Spotify未接続
                </div>

            </div>

        </div>

    </main>


    <!-- ==========================================
         📱 下部ナビゲーション
    ========================================== -->

    <nav class="bottom-nav">

        <button
            onclick="location.href='index.html'"
            class="bottom-nav-item active">

            🏠
            <small>ホーム</small>

        </button>

        <button
            onclick="location.href='search.html'"
            class="bottom-nav-item">

            🔍
            <small>検索</small>

        </button>

        <button
            onclick="location.href='favorites.html'"
            class="bottom-nav-item">

            ❤️
            <small>お気に入り</small>

        </button>

        <button
            onclick="location.href='top-tracks.html'"
            class="bottom-nav-item">

            🔥
            <small>TOP曲</small>

        </button>

    </nav>


    <!-- ==========================================
         Spotify Web Playback SDK
    ========================================== -->

    <script src="https://sdk.scdn.co/spotify-player.js"></script>

    <script>
        window.onSpotifyWebPlaybackSDKReady = function () {

            console.log(
                "Spotify Web Playback SDK 読み込み完了"
            );

            if (
                typeof setupSpotifyPlayer ===
                "function"
            ) {
                setupSpotifyPlayer();
            }

        };
    </script>
    <script src="/script.js"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>


    <!-- ==========================================
         JavaScript
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
