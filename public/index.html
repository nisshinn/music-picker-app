<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         ハンバーガーメニュー
    ========================================== -->

    <button id="menuButton" class="menu-button">
        ☰
    </button>

    <div id="sideMenu" class="side-menu">

        <button id="closeMenu" class="close-menu">
            ×
        </button>

        <h2>メニュー</h2>

        <button onclick="location.href='history.html'">
            🕘 履歴
        </button>

        <button onclick="location.href='account.html'">
            🎵 Spotifyアカウント
        </button>

        <button onclick="location.href='settings.html'">
            ⚙️ 設定
        </button>

    </div>

    <div id="menuOverlay" class="menu-overlay"></div>


    <!-- ==========================================
         ホーム
    ========================================== -->

    <main class="home-page">

        <h1>🎵 Music Picker</h1>

        <p class="subtitle">
            今の気分にぴったりの曲を探そう！
        </p>


        <!-- ======================================
             Spotifyログイン
        ====================================== -->

        <div class="spotify-login-area">

            <button
                id="spotifyLoginButton"
                class="spotify-login-button"
                onclick="location.href='/auth/login'">

                🎵 Spotifyにログイン

            </button>

            <p id="spotifyStatus">
                Spotify未接続
            </p>

        </div>


        <!-- ======================================
             アーティスト検索
        ====================================== -->

        <section class="picker-section">

            <h2>🎤 アーティスト</h2>

            <p class="section-description">
                好きなアーティストを選べます
            </p>

            <input
                type="text"
                id="artistSearch"
                placeholder="アーティスト名を入力..."
                autocomplete="off">

            <div id="artistResults"></div>

            <div id="selectedArtist"></div>

        </section>


        <!-- ======================================
             ジャンル
        ====================================== -->

        <section class="picker-section">

            <h2>🎼 ジャンル</h2>

            <select id="genre">

                <option value="all">
                    すべて
                </option>

                <option value="J-POP">
                    J-POP
                </option>

                <option value="ロック">
                    ロック
                </option>

                <option value="ポップ">
                    ポップ
                </option>

                <option value="アニメ">
                    アニメ
                </option>

                <option value="ボカロ">
                    ボカロ
                </option>

                <option value="ヒップホップ">
                    ヒップホップ
                </option>

                <option value="EDM">
                    EDM
                </option>

                <option value="クラシック">
                    クラシック
                </option>

                <option value="ジャズ">
                    ジャズ
                </option>

                <option value="バラード">
                    バラード
                </option>

            </select>

        </section>


        <!-- ======================================
             気分
        ====================================== -->

        <section class="picker-section">

            <h2>😊 今の気分</h2>

            <div class="moods">

                <button
                    class="mood-button"
                    data-mood="楽しい">
                    😆 楽しい
                </button>

                <button
                    class="mood-button"
                    data-mood="テンション高い">
                    🔥 テンション高い
                </button>

                <button
                    class="mood-button"
                    data-mood="落ち着きたい">
                    😌 落ち着きたい
                </button>

                <button
                    class="mood-button"
                    data-mood="しんみり">
                    🌙 しんみり
                </button>

            </div>

        </section>


        <!-- ======================================
             プレイリスト作成
        ====================================== -->

        <button
            id="makePlaylist"
            class="make-playlist-button">

            🎵 5曲選ぶ

        </button>


        <!-- ======================================
             作成されたプレイリスト
        ====================================== -->

        <section id="playlist" class="playlist">

        </section>


        <!-- ======================================
             プレイヤー
        ====================================== -->

        <section
            id="playerPanel"
            class="player-panel">

            <div id="playerSongTitle">
                再生していません
            </div>

            <div class="player-controls">

                <button id="previousButton">
                    ⏮
                </button>

                <button id="playPauseButton">
                    ▶
                </button>

                <button id="nextButton">
                    ⏭
                </button>

            </div>

            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progressBar"
                    min="0"
                    max="100"
                    value="0">

                <span id="duration">
                    0:00
                </span>

            </div>

        </section>

    </main>


    <!-- ==========================================
         ページ移動
    ========================================== -->

    <nav class="bottom-nav">

        <button
            onclick="location.href='index.html'"
            class="nav-item active">

            <span>🏠</span>
            <small>ホーム</small>

        </button>


        <button
            onclick="location.href='search.html'"
            class="nav-item">

            <span>🔍</span>
            <small>検索</small>

        </button>


        <button
            onclick="location.href='favorites.html'"
            class="nav-item">

            <span>❤️</span>
            <small>お気に入り</small>

        </button>


        <button
            onclick="location.href='top-tracks.html'"
            class="nav-item">

            <span>🔥</span>
            <small>TOP曲</small>

        </button>

    </nav>


    <!-- ==========================================
         Spotify Web Playback SDK
    ========================================== -->

    <script src="https://sdk.scdn.co/spotify-player.js"></script>

    <script>

        window.onSpotifyWebPlaybackSDKReady = function () {

            console.log(
                "Spotify Web Playback SDK 読み込み完了"
            );

            if (
                typeof setupSpotifyPlayer ===
                "function"
            ) {

                setupSpotifyPlayer();

            }

        };

    </script>


    <!-- ==========================================
         JavaScript
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
