<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music Picker</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</head>

<body>
    <!-- ハンバーガーメニュー -->
<button id="menuButton" class="menu-button">
    ☰
</button>

<div id="sideMenu" class="side-menu">

    <div class="menu-header">
        <h2>メニュー</h2>

        <button id="closeMenu" class="close-menu">
            ×
        </button>
    </div>

    <div class="menu-items">

        <button class="menu-item" id="homeMenu">
            🏠 ホーム
        </button>

        <button class="menu-item" id="searchMenu">
            🔍 検索
        </button>

        <button class="menu-item" id="favoritesMenu">
            ❤️ お気に入り
        </button>

        <button class="menu-item" id="historyMenu">
            🕘 再生履歴
        </button>

        <button class="menu-item" id="topTracksMenu">
            🔥 Spotify TOP曲
        </button>

        <button class="menu-item" id="settingsMenu">
            ⚙️ 設定
        </button>

    </div>

</div>

<!-- メニューを開いたときの背景 -->
<div id="menuOverlay" class="menu-overlay"></div>

    <div class="app">

        <h1>🎧 Music Picker</h1>
        <button
    id="spotifyLogin"
    class="spotify-login"
>
    🎵 Spotifyにログイン
</button>

<div id="spotifyStatus">
    Spotify未接続
</div>

        <p class="subtitle">
            今の気分に合った音楽をおまかせで選ぼう
        </p>


        <div class="box">


            <h2>🎤 アーティスト</h2>

<div class="artist-search">

    <input
        type="text"
        id="artistSearch"
        placeholder="Spotifyからアーティストを検索..."
        autocomplete="off"
    >

</div>

<div id="artistResults"></div>

<div
    id="selectedArtist"
    class="selected-artist"
>
    アーティストが選択されていません
</div>
            <h2>🎸 ジャンル</h2>

<select id="genre">

    <option value="all">
        すべてのジャンル
    </option>

    <option value="J-POP">
        J-POP
    </option>

    <option value="ロック">
        ロック
    </option>

    <option value="ポップ">
        ポップ
    </option>

    <option value="アニメ">
        アニメ
    </option>

    <option value="バラード">
        バラード
    </option>

</select>


            <h2>😊 今の気分</h2>

            <div class="moods">

                <button data-mood="楽しい">
                    😊 楽しい
                </button>

                <button data-mood="テンション高い">
                    🔥 テンション高い
                </button>

                <button data-mood="落ち着きたい">
                    😌 落ち着きたい
                </button>

                <button data-mood="しんみり">
                    😢 しんみり
                </button>

            </div>


            <button
                id="makePlaylist"
                class="make-button"
            >
                🎵 プレイリストを作る
            </button>

        </div>
<section id="favoritesPage" class="sub-page">
    <h2>❤️ お気に入り</h2>

    <div id="favoritesList"></div>
</section>
<section id="historyPage" class="sub-page">
    <h2>🕘 再生履歴</h2>
    <div id="historyList"></div>
</section>

        <button id="topTracksButton" class="feature-button">
    🔥 Spotify TOP曲
</button>
<button id="searchButton" class="feature-button">
    🔍 曲・アーティスト検索
</button>
<!-- ==========================================
     曲・アーティスト検索
========================================== -->
<div id="searchPage" class="sub-page">

    <div class="box">

        <h2>🔍 曲・アーティスト検索</h2>

        <input
            type="text"
            id="musicSearchInput"
            class="music-search-input"
            placeholder="曲名やアーティスト名を入力"
        >

        <button
            id="musicSearchButton"
            class="make-button"
        >
            🔍 検索
        </button>

    </div>

    <div id="searchResults"></div>

</div>

<div id="playlist"></div>
<!-- 再生状況 -->
<div id="playerPanel" class="player-panel">
    <img id="playerImage" src="" alt="">

    <div class="player-info">
        <div id="playerTitle">再生していません</div>
        <div id="playerArtist">---</div>

        <div class="player-progress">
            <span id="playerCurrentTime">0:00</span>

            <input
                id="playerProgress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <span id="playerDuration">0:00</span>
        </div>

        <div class="player-controls">
            <button id="playerPrev">⏮</button>
            <button id="playerPlay">▶</button>
            <button id="playerNext">⏭</button>
        </div>

        <div id="playerStatus">
            停止中
        </div>
    </div>
</div>
    </div>


    <script src="script.js"></script>

</body>

</html>
