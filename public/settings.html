<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>設定 - Music Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ハンバーガーメニュー -->

    <button id="menuButton" class="menu-button">
        ☰
    </button>

    <div id="sideMenu" class="side-menu">

        <button id="closeMenu" class="close-menu">
            ×
        </button>

        <h2>メニュー</h2>

        <button onclick="location.href='history.html'">
            🕘 履歴
        </button>

        <button onclick="location.href='account.html'">
            🎵 Spotifyアカウント
        </button>

        <button onclick="location.href='settings.html'">
            ⚙️ 設定
        </button>

    </div>

    <div id="menuOverlay" class="menu-overlay"></div>


    <!-- 設定 -->

    <main class="sub-page active">

        <h1>⚙️ 設定</h1>

        <p class="subtitle">
            Music Pickerの設定
        </p>


        <!-- テーマ -->

        <section class="setting-section">

            <h2>🎨 テーマ</h2>

            <div class="theme-options">

                <button
                    class="theme-option"
                    data-theme="light">

                    ☀️
                    <span>ライト</span>

                </button>

                <button
                    class="theme-option"
                    data-theme="dark">

                    🌙
                    <span>ダーク</span>

                </button>

                <button
                    class="theme-option"
                    data-theme="pink">

                    🌸
                    <span>ピンク</span>

                </button>

                <button
                    class="theme-option"
                    data-theme="blue">

                    💙
                    <span>ブルー</span>

                </button>

            </div>

        </section>


        <!-- 曲数 -->

        <section class="setting-section">

            <h2>🎵 プレイリストの曲数</h2>

            <select id="songCount">

                <option value="5">
                    5曲
                </option>

                <option value="10">
                    10曲
                </option>

            </select>

        </section>


        <!-- 履歴 -->

        <section class="setting-section">

            <h2>🕘 履歴</h2>

            <button
                id="clearHistoryButton"
                class="make-button">

                🗑️ 履歴を削除

            </button>

        </section>


        <p id="settingsMessage"></p>

    </main>


    <!-- 下部ナビ -->

    <nav class="bottom-nav">

        <button
            onclick="location.href='index.html'"
            class="bottom-nav-item">

            <span>🏠</span>
            <small>ホーム</small>

        </button>

        <button
            onclick="location.href='search.html'"
            class="bottom-nav-item">

            <span>🔍</span>
            <small>検索</small>

        </button>

        <button
            onclick="location.href='favorites.html'"
            class="bottom-nav-item">

            <span>❤️</span>
            <small>お気に入り</small>

        </button>

        <button
            onclick="location.href='top-tracks.html'"
            class="bottom-nav-item">

            <span>🔥</span>
            <small>TOP曲</small>

        </button>

    </nav>


    <script src="script.js"></script>

</body>

</html>
