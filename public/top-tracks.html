<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOP曲 - Music Picker</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <!-- ==========================================
         ハンバーガーメニュー
    ========================================== -->

    <button id="menuButton" class="menu-button">
        ☰
    </button>

    <div id="sideMenu" class="side-menu">

        <button id="closeMenu" class="close-menu">
            ×
        </button>

        <h2>メニュー</h2>

        <button onclick="location.href='history.html'">
            🕘 履歴
        </button>

        <button onclick="location.href='account.html'">
            🎵 Spotifyアカウント
        </button>

        <button onclick="location.href='settings.html'">
            ⚙️ 設定
        </button>

    </div>

    <div id="menuOverlay" class="menu-overlay"></div>


    <!-- ==========================================
         TOP曲ページ
    ========================================== -->

    <main class="sub-page top-tracks-page">

        <div class="page-header">

            <button
                class="back-button"
                onclick="location.href='index.html'">

                ←

            </button>

            <h1>🔥 TOP曲</h1>

        </div>


        <p class="subtitle">
            あなたがよく聴いている曲
        </p>


        <!-- ======================================
             TOP曲一覧
        ====================================== -->

        <section
            id="topTracksList"
            class="top-tracks-list">

            <div class="loading-message">
                🔄 TOP曲を読み込んでいます...
            </div>

        </section>

    </main>


    <!-- ==========================================
         下のナビゲーション
    ========================================== -->

    <nav class="bottom-nav">

        <button
            onclick="location.href='index.html'"
            class="nav-item">

            <span>🏠</span>
            <small>ホーム</small>

        </button>


        <button
            onclick="location.href='search.html'"
            class="nav-item">

            <span>🔍</span>
            <small>検索</small>

        </button>


        <button
            onclick="location.href='favorites.html'"
            class="nav-item">

            <span>❤️</span>
            <small>お気に入り</small>

        </button>


        <button
            onclick="location.href='top-tracks.html'"
            class="nav-item active">

            <span>🔥</span>
            <small>TOP曲</small>

        </button>

    </nav>


    <!-- ==========================================
         JavaScript
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
