services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
    env_file:
      - .env
    command: sh -c "npm install && node --watch server.js"
    restart: unless-stopped
