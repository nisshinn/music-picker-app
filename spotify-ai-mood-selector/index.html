<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify AI Mood Selector</title>
    <meta name="description" content="AIが今の気分やシチュエーションに合わせてSpotify楽曲を5曲厳選。ブラウザ上のSpotify埋め込みプレイヤーで即時試聴、連続再生コントローラー、お気に入り保存に対応。" />
    <meta property="og:title" content="Spotify AI Mood Selector" />
    <meta property="og:description" content="AIが今の気分やシチュエーションに合わせてSpotify楽曲を5曲厳選。ブラウザ上のSpotify埋め込みプレイヤーで即時試聴、連続再生コントローラー、お気に入り保存に対応。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully prevent unhandled cross-origin third-party script errors from breaking the application
      window.addEventListener('error', function(event) {
        if (event && (event.message === 'Script error.' || (event.filename && event.filename.includes('scdn.co')))) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason).includes('Script error') || String(event.reason).includes('scdn.co'))) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
